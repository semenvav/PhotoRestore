[project]
name = "restore-agent"
dynamic = ["version"]
description = "Агент photo-restore: берёт задачи с сервера и выполняет их в локальном ComfyUI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pillow>=11.0",  # только для FAKE_COMFY=1
]

[project.scripts]
restore-agent = "restore_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "restore_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["restore_agent"]
