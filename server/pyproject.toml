[project]
name = "photo-restore-server"
version = "0.1.0"
description = "Сервер photo-restore: учёт, хранение, UI, очередь, Gemini"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "imagehash>=4.3",
    "numpy>=2.0",
    "tzdata",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
